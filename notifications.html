<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARI - Notifications & Stock Status</title>

  <link rel="stylesheet" href="css/style.css?v=14.0">
  <link rel="stylesheet" href="css/extra.css?v=14.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .notif-page {
      width: 100%;
      min-height: calc(100vh - 100px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 15px 20px 30px;
      box-sizing: border-box;
    }

    .notif-card-container {
      width: 100%;
      max-width: 680px;
      background-color: #1b3b32;
      border: 2px solid #9DC88D;
      border-radius: 20px;
      padding: 22px 25px;
      margin: 0 auto;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      color: #ffffff;
      box-sizing: border-box;
    }

    .notif-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }

    .notif-header-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #9DC88D;
      color: #164A41;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .notif-header h2 {
      margin: 0;
      font-size: 1.15rem;
      color: #ffffff;
      font-weight: 800;
    }

    .notif-header p {
      margin: 2px 0 0;
      color: #cbd5e1;
      font-size: 0.75rem;
    }

    .notif-summary {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .notif-summary-item {
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 0.68rem;
      font-weight: 700;
    }

    .notif-summary-inventory {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }

    .notif-summary-transactions {
      background: rgba(96, 165, 250, 0.15);
      color: #60a5fa;
    }

    .notif-summary-credit {
      background: rgba(249, 115, 22, 0.15);
      color: #fb923c;
    }

    #notificationsContainer {
      width: 100%;
    }

    .notif-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .notif-item-icon {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notif-item-content {
      flex: 1;
      min-width: 0;
    }

    .notif-item-content h4 {
      margin: 0 0 3px;
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .notif-item-content p {
      margin: 0;
      color: #cbd5e1;
      font-size: 0.76rem;
      line-height: 1.4;
    }

    .notif-item-time {
      color: #9DC88D;
      font-size: 0.68rem;
      white-space: nowrap;
    }

    .notif-empty {
      text-align: center;
      color: #cbd5e1;
      padding: 30px 15px;
      font-size: 0.82rem;
    }

    .notif-loading {
      text-align: center;
      color: #cbd5e1;
      padding: 30px 15px;
      font-size: 0.82rem;
    }

    .notif-error {
      text-align: center;
      color: #f87171;
      padding: 25px 15px;
      font-size: 0.82rem;
    }

    .notif-debug {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(0,0,0,0.2);
      color: #94a3b8;
      font-size: 0.68rem;
      text-align: left;
      word-break: break-word;
    }

    .notif-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .notif-section-title strong {
      color: #ffffff;
      font-size: 0.82rem;
    }

    .notif-count {
      background: rgba(157, 200, 141, 0.15);
      color: #9DC88D;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 0.65rem;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .notif-page {
        padding: 10px;
      }

      .notif-card-container {
        max-width: 100%;
        padding: 18px;
      }

      .notif-item-time {
        display: none;
      }
    }
  </style>
</head>

<body class="app-page">

<div class="app-shell">

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-top">
      <a href="index.html" class="sidebar-logo">Sari</a>
    </div>

    <nav class="sidebar-nav">

      <a href="index.html" class="sidebar-link">
        <span class="sidebar-icon">
          <i class="fa-solid fa-house"></i>
        </span>
        <span class="sidebar-label">Home</span>
      </a>

      <a href="inventory.html" class="sidebar-link">
        <span class="sidebar-icon">
          <i class="fa-solid fa-box"></i>
        </span>
        <span class="sidebar-label">Inventory</span>
      </a>

      <a href="checkout.html" class="sidebar-link">
        <span class="sidebar-icon">
          <i class="fa-solid fa-cash-register"></i>
        </span>
        <span class="sidebar-label">Checkout</span>
      </a>

      <a href="dashboard.html" class="sidebar-link">
        <span class="sidebar-icon">
          <i class="fa-solid fa-chart-pie"></i>
        </span>
        <span class="sidebar-label">Dashboard</span>
      </a>

      <a href="credit-ledger.html" class="sidebar-link">
        <span class="sidebar-icon">
          <i class="fa-solid fa-money-check-dollar"></i>
        </span>
        <span class="sidebar-label">Credit Ledger</span>
      </a>

      <a href="transactions.html" class="sidebar-link">
        <span class="sidebar-icon">
          <i class="fa-solid fa-receipt"></i>
        </span>
        <span class="sidebar-label">Transactions</span>
      </a>

      <a href="settings.html" class="sidebar-link">
        <span class="sidebar-icon">
          <i class="fa-solid fa-gear"></i>
        </span>
        <span class="sidebar-label">Settings</span>
      </a>

      <a href="profile.html" class="sidebar-link">
        <span class="sidebar-icon">
          <i class="fa-solid fa-user"></i>
        </span>
        <span class="sidebar-label">My Profile</span>
      </a>

    </nav>

    <div class="sidebar-spacer"></div>

    <button
      id="logoutBtn"
      class="sidebar-logout"
      style="background:none;border:none;cursor:pointer;width:100%;text-align:left;color:inherit;"
    >
      <span class="sidebar-icon">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </span>
      <span class="sidebar-label">Log Out</span>
    </button>

  </aside>

  <main class="main-content">

    <div class="topbar-row">

      <button
        class="topbar-menu-btn"
        id="topbarMenuBtn"
        type="button"
        aria-label="Toggle sidebar"
      >
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="topbar">

        <div class="topbar-left">
          <button class="topbar-home-btn" type="button">
            Notifications & Stock Status
          </button>
        </div>

        <div
          class="topbar-store"
          id="profileBtn"
          style="color:inherit;cursor:default;display:flex;align-items:center;gap:10px;"
        >
          <span
            class="topbar-avatar"
            id="topbarAvatarContainer"
          ></span>

          <span id="topbarStoreName">
            Loading...
          </span>
        </div>

      </div>

    </div>

    <div class="notif-page">

      <div class="notif-card-container">

        <div class="notif-header">

          <div class="notif-header-icon">
            <i class="fa-solid fa-bell"></i>
          </div>

          <div>
            <h2>Stock Status & Alerts</h2>
            <p>Inventory, transactions, and credit notifications.</p>
          </div>

        </div>

        <div
          id="notificationSummary"
          class="notif-summary"
        ></div>

        <div id="notificationsContainer">

          <div class="notif-loading">
            <i
              class="fa-solid fa-spinner fa-spin"
              style="font-size:22px;color:#9DC88D;margin-bottom:10px;"
            ></i>

            <br>

            Connecting to SARI database...
          </div>

        </div>

      </div>

    </div>

  </main>

</div>

<script src="js/script.js?v=14.0"></script>

<script type="module">

import { db, auth } from "./js/firebase-config.js";

import {
  collection,
  query,
  where,
  onSnapshot,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const container = document.getElementById("notificationsContainer");
const summary = document.getElementById("notificationSummary");
const storeName = document.getElementById("topbarStoreName");
const avatar = document.getElementById("topbarAvatarContainer");

let products = [];
let transactions = [];
let credits = [];

let productsReady = false;
let transactionsReady = false;
let creditsReady = false;

function showLoading(message) {
  if (!container) return;

  container.innerHTML = `
    <div class="notif-loading">
      <i
        class="fa-solid fa-spinner fa-spin"
        style="font-size:22px;color:#9DC88D;margin-bottom:10px;"
      ></i>
      <br>
      ${escapeHtml(message)}
    </div>
  `;
}

function showError(message) {
  if (!container) return;

  container.innerHTML = `
    <div class="notif-error">
      <i
        class="fa-solid fa-triangle-exclamation"
        style="font-size:28px;margin-bottom:10px;"
      ></i>

      <br>

      Failed to load notifications.

      <div class="notif-debug">
        ${escapeHtml(message)}
      </div>
    </div>
  `;
}

showLoading("Checking Firebase connection...");

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    if (storeName) {
      storeName.innerText = "Not Logged In";
    }

    if (container) {
      container.innerHTML = `
        <div class="notif-error">
          <i
            class="fa-solid fa-user-lock"
            style="font-size:28px;margin-bottom:10px;"
          ></i>

          <br>

          Please log in first.
        </div>
      `;
    }

    return;
  }

  const userId = user.uid;

  console.log("SARI NOTIFICATIONS USER:", userId);

  try {

    const userRef = doc(db, "users", userId);
    const userSnap = await getDoc(userRef);

    if (userSnap.exists()) {

      const userData = userSnap.data();

      if (storeName) {
        storeName.innerText =
          userData.store_name ||
          userData.full_name ||
          "My Store";
      }

      if (avatar) {

        if (userData.profile_image) {

          avatar.innerHTML = `
            <img
              src="${escapeHtml(userData.profile_image)}"
              class="topbar-avatar"
              style="object-fit:cover;"
              alt="Avatar"
            >
          `;

        } else {

          avatar.innerText =
            (userData.full_name || "U")
              .charAt(0)
              .toUpperCase();

        }

      }

    } else {

      if (storeName) {
        storeName.innerText = "My Store";
      }

    }

  } catch (error) {

    console.error("USER PROFILE ERROR:", error);

  }

  loadProducts(userId);
  loadTransactions(userId);
  loadCredits(userId);

});

function loadProducts(userId) {

  const productsQuery = query(
    collection(db, "products"),
    where("userId", "==", userId)
  );

  onSnapshot(
    productsQuery,
    (snapshot) => {

      products = [];

      snapshot.forEach((item) => {

        products.push({
          id: item.id,
          ...item.data()
        });

      });

      productsReady = true;

      console.log("PRODUCTS:", products);

      renderNotifications();

    },
    (error) => {

      console.error("PRODUCTS ERROR:", error);

      productsReady = true;

      showError(
        "Products: " + error.message
      );

    }
  );

}

function loadTransactions(userId) {

  const transactionsQuery = query(
    collection(db, "transactions"),
    where("userId", "==", userId)
  );

  onSnapshot(
    transactionsQuery,
    (snapshot) => {

      transactions = [];

      snapshot.forEach((item) => {

        transactions.push({
          id: item.id,
          ...item.data()
        });

      });

      transactionsReady = true;

      console.log(
        "TRANSACTIONS:",
        transactions
      );

      renderNotifications();

    },
    (error) => {

      console.error(
        "TRANSACTIONS ERROR:",
        error
      );

      transactionsReady = true;

      renderNotifications();

    }
  );

}

function loadCredits(userId) {

  const creditsQuery = query(
    collection(db, "credits"),
    where("userId", "==", userId)
  );

  onSnapshot(
    creditsQuery,
    (snapshot) => {

      credits = [];

      snapshot.forEach((item) => {

        credits.push({
          id: item.id,
          ...item.data()
        });

      });

      creditsReady = true;

      console.log(
        "CREDITS:",
        credits
      );

      renderNotifications();

    },
    (error) => {

      console.error(
        "CREDITS ERROR:",
        error
      );

      creditsReady = true;

      renderNotifications();

    }
  );

}

function renderNotifications() {

  if (
    !productsReady &&
    !transactionsReady &&
    !creditsReady
  ) {
    return;
  }

  const notifications = [];

  products.forEach((product) => {

    const stock = Number(
      product.stock ?? 0
    );

    if (stock === 0) {

      notifications.push({
        type: "inventory",
        title: "Out of Stock",
        message:
          `"${product.name || "Product"}" is out of stock.`,
        icon: "fa-circle-xmark",
        color: "#ef4444",
        time: 0
      });

    } else if (stock <= 5) {

      notifications.push({
        type: "inventory",
        title: "Low Stock",
        message:
          `"${product.name || "Product"}" has only ${stock} left.`,
        icon: "fa-triangle-exclamation",
        color: "#f59e0b",
        time: 0
      });

    }

  });

  transactions
    .sort((a, b) => {

      return getTime(
        b.createdAt ||
        b.created_at ||
        b.timestamp
      ) -
      getTime(
        a.createdAt ||
        a.created_at ||
        a.timestamp
      );

    })
    .slice(0, 20)
    .forEach((transaction) => {

      const amount = Number(
        transaction.totalAmount ??
        transaction.total_amount ??
        transaction.amount ??
        0
      );

      const customer =
        transaction.customerName ||
        transaction.customer_name ||
        "Walk-in Customer";

      const method =
        transaction.paymentMethod ||
        transaction.payment_method ||
        "Cash";

      const time = getTime(
        transaction.createdAt ||
        transaction.created_at ||
        transaction.timestamp
      );

      notifications.push({

        type: "transaction",

        title: "New Transaction",

        message:
          `${customer} — ${method} — ₱${amount.toFixed(2)}`,

        icon: "fa-receipt",

        color: "#60a5fa",

        time: time

      });

    });

  credits.forEach((credit) => {

    const amount = Number(
      credit.amount ??
      credit.totalAmount ??
      credit.total_amount ??
      0
    );

    const customer =
      credit.customerName ||
      credit.customer_name ||
      "Customer";

    const time = getTime(
      credit.updatedAt ||
      credit.updated_at ||
      credit.createdAt ||
      credit.created_at ||
      credit.date
    );

    if (credit.isPaid === true) {

      notifications.push({

        type: "credit",

        title: "Credit Paid",

        message:
          `${customer} paid ₱${amount.toFixed(2)}.`,

        icon: "fa-circle-check",

        color: "#22c55e",

        time: time

      });

    } else {

      notifications.push({

        type: "credit",

        title: "Unpaid Credit",

        message:
          `${customer} owes ₱${amount.toFixed(2)}.`,

        icon: "fa-money-bill-transfer",

        color: "#f97316",

        time: time

      });

    }

  });

  notifications.sort(
    (a, b) => Number(b.time || 0) - Number(a.time || 0)
  );

  const inventoryCount =
    notifications.filter(
      item => item.type === "inventory"
    ).length;

  const transactionCount =
    notifications.filter(
      item => item.type === "transaction"
    ).length;

  const creditCount =
    notifications.filter(
      item => item.type === "credit"
    ).length;

  if (summary) {

    summary.innerHTML = `

      ${
        inventoryCount > 0
          ? `
            <span class="notif-summary-item notif-summary-inventory">
              Inventory ${inventoryCount}
            </span>
          `
          : ""
      }

      ${
        transactionCount > 0
          ? `
            <span class="notif-summary-item notif-summary-transactions">
              Transactions ${transactionCount}
            </span>
          `
          : ""
      }

      ${
        creditCount > 0
          ? `
            <span class="notif-summary-item notif-summary-credit">
              Credit ${creditCount}
            </span>
          `
          : ""
      }

    `;

  }

  if (!notifications.length) {

    if (container) {

      container.innerHTML = `

        <div class="notif-empty">

          <i
            class="fa-solid fa-bell-slash"
            style="
              font-size:28px;
              color:#9DC88D;
              margin-bottom:10px;
            "
          ></i>

          <br>

          No notifications yet.

          <br>

          <span
            style="
              font-size:0.7rem;
              color:#94a3b8;
            "
          >
            Your inventory, transactions, and credits will appear here.
          </span>

        </div>

      `;

    }

    return;
  }

  if (!container) return;

  container.innerHTML = `

    <div class="notif-section-title">

      <strong>
        Recent Notifications
      </strong>

      <span class="notif-count">
        ${notifications.length}
      </span>

    </div>

    ${notifications.map((item) => `

      <div class="notif-item">

        <div
          class="notif-item-icon"
          style="
            color:${item.color};
            background:${item.color}20;
          "
        >
          <i class="fa-solid ${item.icon}"></i>
        </div>

        <div class="notif-item-content">

          <h4>
            ${escapeHtml(item.title)}
          </h4>

          <p>
            ${escapeHtml(item.message)}
          </p>

        </div>

        <div class="notif-item-time">

          ${
            item.time
              ? formatTime(item.time)
              : ""
          }

        </div>

      </div>

    `).join("")}

  `;

}

function getTime(value) {

  if (!value) {
    return 0;
  }

  if (
    typeof value.toMillis === "function"
  ) {
    return value.toMillis();
  }

  if (
    typeof value.toDate === "function"
  ) {
    return value.toDate().getTime();
  }
  if (value instanceof Date) {
    return value.getTime();
  }
  if (typeof value === "number") {
    return value;
  }
  if (typeof value === "string") {

    const parsed =
      new Date(value).getTime();

    return Number.isNaN(parsed)
      ? 0
      : parsed;

  }
  if (
    typeof value === "object" &&
    value.seconds !== undefined
  ) {

    return Number(value.seconds) * 1000;

  }

  return 0;

}

function formatTime(timestamp) {

  const date =
    new Date(timestamp);

  if (
    Number.isNaN(date.getTime())
  ) {
    return "";
  }

  return date.toLocaleString(
    "en-US",
    {
      month: "short",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }
  );

}

function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
