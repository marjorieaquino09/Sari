<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARI - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-split-container">
    
    <div class="login-left-banner">
      <div class="banner-content-box">
        
        <div class="banner-center-brand">
          <div class="banner-logo-wrap">
            <img src="assets/sari-logo.jpg" alt="SARI Logo" class="banner-logo-img">
          </div>
          <h1 class="banner-brand-name">SARI</h1>
          <div class="banner-brand-subline">
            <span class="line-deco"></span>
            <span class="subline-text">SARI-SARI STORE</span>
            <span class="line-deco"></span>
          </div>
        </div>
        
        <p class="banner-cursive-tagline">Everyday Essentials, Just Around the Corner.</p>
        
        <div class="features-row-minimal">
          <div class="feature-item-min">
            <div class="feat-icon-circle"><i class="fa-solid fa-basket-shopping"></i></div>
            <span>Fresh Products</span>
          </div>
          <div class="feature-item-min">
            <div class="feat-icon-circle"><i class="fa-solid fa-bolt"></i></div>
            <span>Quick & Easy</span>
          </div>
          <div class="feature-item-min">
            <div class="feat-icon-circle"><i class="fa-solid fa-shield-halved"></i></div>
            <span>Safe & Secure</span>
          </div>
          <div class="feature-item-min">
            <div class="feat-icon-circle"><i class="fa-solid fa-heart"></i></div>
            <span>For Our Community</span>
          </div>
        </div>

      </div>
    </div>

    <div class="login-right-section">
      <div class="form-wrapper">
        <div class="card-logo-top">
          <div class="card-logo-wrap">
            <img src="assets/sari-logo.jpg" alt="SARI Logo" class="card-logo-img">
          </div>
        </div>
        <h2 class="welcome-title">Welcome back!</h2>
        <p class="subtitle">Log in to manage your store.</p>

        <div id="errorBox" class="error-message"></div>

        <form id="loginForm">
          <div class="input-group">
            <label for="loginEmail">Email Address</label>
            <div class="input-field-box">
              <i class="fa-solid fa-envelope field-icon"></i>
              <input type="email" id="loginEmail" placeholder="owner@example.com" required>
            </div>
          </div>

          <div class="input-group">
            <label for="loginPassword">Password</label>
            <div class="input-field-box">
              <i class="fa-solid fa-lock field-icon"></i>
              <input type="password" id="loginPassword" placeholder="Enter your password" required>
              <i class="fa-solid fa-eye toggle-eye" id="togglePassword"></i>
            </div>
          </div>

          <div class="forgot-wrapper" style="position: relative; z-index: 9999;">
  <a href="forgot-password.html" onclick="window.location.href='forgot-password.html'; return false;" class="forgot-link" style="pointer-events: auto !important; cursor: pointer !important;">Forgot Password?</a>
</div>

          <button type="submit" id="btnLogin" class="btn-login">
            <i class="fa-solid fa-arrow-right"></i> Log In
          </button>
        </form>

        <p class="signup-text">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </p>
      </div>
    </div>

  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
