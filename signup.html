<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARI - Sign Up</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-split-container signup-active">
    
    <div class="login-left-banner">
      <div class="banner-content-box">
        
        <div class="banner-center-brand">
          <div class="banner-logo-wrap">
            <img src="assets/sari-logo.jpg" alt="SARI Logo" class="banner-logo-img">
          </div>
          <h1 class="banner-brand-name">SARI</h1>
          <div class="banner-brand-subline">
            <span class="line-deco"></span>
            <span class="subline-text">SARI-SARI STORE</span>
            <span class="line-deco"></span>
          </div>
        </div>
        
        <p class="banner-cursive-tagline">Everyday Essentials, Just Around the Corner.</p>
        
        <div class="features-row-minimal">
          <div class="feature-item-min">
            <div class="feat-icon-circle"><i class="fa-solid fa-basket-shopping"></i></div>
            <span>Fresh Products</span>
          </div>
          <div class="feature-item-min">
            <div class="feat-icon-circle"><i class="fa-solid fa-bolt"></i></div>
            <span>Quick & Easy</span>
          </div>
          <div class="feature-item-min">
            <div class="feat-icon-circle"><i class="fa-solid fa-shield-halved"></i></div>
            <span>Safe & Secure</span>
          </div>
          <div class="feature-item-min">
            <div class="feat-icon-circle"><i class="fa-solid fa-heart"></i></div>
            <span>For Our Community</span>
          </div>
        </div>

      </div>
    </div>

    <div class="login-right-section">
      <div class="form-wrapper">
        <div class="card-logo-top">
          <div class="card-logo-wrap">
            <img src="assets/sari-logo.jpg" alt="SARI Logo" class="card-logo-img">
          </div>
        </div>
        <h2 class="welcome-title">Create Account</h2>
        <p class="subtitle">Sign up to start managing your store.</p>

        <div id="errorBox" class="error-message"></div>

        <form id="signupForm">
          <div class="input-group">
            <label for="signupName">Store / Owner Name</label>
            <div class="input-field-box">
              <i class="fa-solid fa-user field-icon"></i>
              <input type="text" id="signupName" placeholder="Juan Dela Cruz" required>
            </div>
          </div>

          <div class="input-group">
            <label for="signupEmail">Email Address</label>
            <div class="input-field-box">
              <i class="fa-solid fa-envelope field-icon"></i>
              <input type="email" id="signupEmail" placeholder="owner@example.com" required>
            </div>
          </div>

          <div class="input-group">
            <label for="signupPassword">Password</label>
            <div class="input-field-box password-wrapper">
              <i class="fa-solid fa-lock field-icon"></i>
              <input type="password" id="signupPassword" placeholder="Create a password" required>
              <i class="fa-solid fa-eye toggle-eye" id="toggleSignupPassword"></i>
            </div>
          </div>

          <button type="submit" id="btnSignup" class="btn-login">
            <i class="fa-solid fa-user-plus"></i> Sign Up
          </button>
        </form>

        <p class="signup-text">
          Already have an account? <a href="login.html">Log In</a>
        </p>
      </div>
    </div>

  </div>

  <script type="module" src="js/signup.js"></script>
</body>
</html>
