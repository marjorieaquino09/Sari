<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARI - Sign Up</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="signup-page">

  <div class="signup-card">
    <div class="header-container">
      <h1 class="brand-title">SARI<span class="dot">.</span></h1>
      <span class="page-title">Sign up</span>
    </div>

    <form id="signupForm">
      <div class="input-group">
        <label for="signupFullName">Full Name</label>
        <input type="text" id="signupFullName" placeholder="Juan Dela Cruz" required>
      </div>

      <div class="input-group">
        <label for="signupStoreName">Store name</label>
        <input type="text" id="signupStoreName" placeholder="Majo's Store" required>
      </div>

      <div class="input-row">
        <div class="input-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="owner@example.com" required>
        </div>

        <div class="input-group">
          <label for="signupDob">Date of Birth</label>
          <input type="date" id="signupDob" required>
        </div>
      </div>

      <div class="input-group">
        <label for="signupPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="signupPassword" required>
          <i class="fa-solid fa-eye-slash toggle-eye" id="togglePassword"></i>
        </div>
      </div>

      <div class="input-group">
        <label for="signupConfirmPassword">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="signupConfirmPassword" required>
          <i class="fa-solid fa-eye-slash toggle-eye" id="toggleConfirmPassword"></i>
        </div>
      </div>

      <div id="errorBox" class="error-message"></div>

      <div class="button-wrapper">
        <button type="submit" id="btnSignup" class="btn-signup">Sign Up</button>
      </div>

      <p class="signup-footer-text">
        Already have an account? <a href="login.html">Log In</a>
      </p>
    </form>
  </div>

  <script type="module" src="js/signup.js"></script>
</body>
</html>
