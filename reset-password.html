<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARI - Set New Password</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-split-container">
    
    <div class="login-left-banner">
      <div class="banner-content-box">
        <div class="banner-center-brand">
          <div class="banner-logo-wrap">
            <img src="assets/sari-logo.jpg" alt="SARI Logo" class="banner-logo-img">
          </div>
          <h1 class="banner-brand-name">SARI</h1>
          <div class="banner-brand-subline">
            <span class="line-deco"></span>
            <span class="subline-text">SARI-SARI STORE</span>
            <span class="line-deco"></span>
          </div>
        </div>
        <p class="banner-cursive-tagline">Everyday Essentials, Just Around the Corner.</p>
      </div>
    </div>

    <div class="login-right-section">
      <div class="form-wrapper">
        <div class="card-logo-top">
          <div class="card-logo-wrap">
            <img src="assets/sari-logo.jpg" alt="SARI Logo" class="card-logo-img">
          </div>
        </div>
        <h2 class="welcome-title">Set New Password</h2>
        <p class="subtitle">Enter your new password below to update your account.</p>

        <div id="errorBox" class="error-message"></div>

        <form id="resetPasswordForm">
          <div class="input-group">
            <label for="newPassword">New Password</label>
            <div class="input-field-box">
              <i class="fa-solid fa-lock field-icon"></i>
              <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6">
            </div>
          </div>

          <div class="input-group">
            <label for="confirmPassword">Confirm New Password</label>
            <div class="input-field-box">
              <i class="fa-solid fa-lock field-icon"></i>
              <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6">
            </div>
          </div>

          <button type="submit" id="btnSubmit" class="btn-login">
            <i class="fa-solid fa-key"></i> Update Password
          </button>
        </form>

        <p class="signup-text">
          Back to <a href="login.html">Log In</a>
        </p>
      </div>
    </div>

  </div>

  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
